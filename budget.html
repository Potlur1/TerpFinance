<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TerpFinance - Budgets</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="main.css" />
</head>
<body class="background">
  <main class="screen">
    <section class="page-header">
      <h1>Budgets</h1>
      <p>Track short-term and long-term goals</p>
    </section>

    <section class="card summary-card">
      <div class="section-title-row">
        <h2>Main Budget Goal</h2>
      </div>

      <div class="inner-card">
        <div class="budget-top">
          <div>
            <h3 id="mainBudgetName">Weekly Essentials</h3>
            <p class="muted" id="mainBudgetSubtitle">Stay under your $500 weekly budget</p>
          </div>
          <div class="money positive" id="mainBudgetRightText">$320 left</div>
        </div>

        <div class="progress-bar">
          <div id="mainBudgetProgressFill" class="progress-fill green" style="width: 64%;"></div>
        </div>

        <div class="row between small-text">
          <span id="mainBudgetTargetText"><strong>Target:</strong> Stay under $500 this week</span>
          <span id="mainBudgetPercentText">64% remaining</span>
        </div>

        <div class="card-button-row">
          <button id="editMainBudgetBtn" class="secondary-btn" type="button">Edit</button>
        </div>
      </div>
    </section>

    <section class="action-row">
      <button id="openAddModalBtn" class="primary-btn" type="button">+ Add Budget</button>
    </section>

    <section class="budget-section">
      <div class="section-title-row">
        <h2>Short-Term Budgets</h2>
      </div>
      <div id="shortTermBudgetList"></div>
    </section>

    <section class="budget-section">
      <div class="section-title-row">
        <h2>Long-Term Budgets</h2>
      </div>
      <div id="longTermBudgetList"></div>
    </section>
  </main>

  <div id="budgetModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Add Budget</h2>
        <button id="closeModalBtn" class="icon-btn" type="button" aria-label="Close modal">&times;</button>
      </div>

      <form id="budgetForm">
        <label for="budgetType">Budget Type</label>
        <select id="budgetType" required>
          <option value="">Select one</option>
          <option value="short">Short-Term</option>
          <option value="long">Long-Term</option>
          <option value="main">Main Budget Goal</option>
        </select>

        <label for="budgetName">Budget Name</label>
        <input type="text" id="budgetName" placeholder="e.g. Groceries This Week" required />

        <label for="budgetCategory">Category</label>
        <input type="text" id="budgetCategory" placeholder="e.g. Food, Savings, Car" required />

        <label for="targetAmount">Target Amount ($)</label>
        <input type="number" id="targetAmount" min="0" placeholder="180" required />

        <label for="currentAmount">Current Amount ($)</label>
        <input type="number" id="currentAmount" min="0" placeholder="140" required />

        <div id="shortTermFields">
          <label for="endDate">End Date</label>
          <input type="text" id="endDate" placeholder="Apr 20" />
        </div>

        <div id="longTermFields" class="hidden">
          <label for="milestoneDate">Milestone Date</label>
          <input type="text" id="milestoneDate" placeholder="October 2027" />
        </div>

        <div id="mainBudgetFields" class="hidden">
          <label for="mainBudgetSubtitleInput">Subtitle / Goal Text</label>
          <input type="text" id="mainBudgetSubtitleInput" placeholder="Stay under your $500 weekly budget" />
        </div>

        <input type="hidden" id="editIndex" value="" />
        <input type="hidden" id="editingMainBudget" value="false" />

        <div class="modal-button-row">
          <button type="submit" class="primary-btn">Save Budget</button>
          <button type="button" id="cancelModalBtn" class="secondary-btn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div class="navigation_bar"> 
    <ul class="menu_bar">
      <li><a href="analytics.html"><img src="Icon-Images/analytics.png" alt="Analytics" class="icon"></a></li>
      <li><a href="calendar.html"><img src="Icon-Images/calendar.png" alt="Calendar" class="icon"></a></li>
      <li><a href="index.html"><img src="Icon-Images/home.png" alt="Home" class="icon"></a></li>
      <li><a href="budget.html"><img src="Icon-Images/budget.png" alt="Budget" class="icon"></a></li>
      <li><a href="profile.html"><img src="Icon-Images/profile.png" alt="Profile" class="icon"></a></li>
    </ul>
  </div>

  <script src="main.js"></script>
</body>
</html>
