<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TerpFinance</title>
  <link rel="stylesheet" href="css/home.css" />
</head>
<body id="home_background">

  <div class="home_page">
    <div class="welcome_message">
      <h1 id="welcome_back">Welcome Back, John</h1>
      <p id="recent_transaction">Recent Transactions</p>
    </div>

    <div class="transactions_section">
      <ul class="transactions_list" id="transactions_list"></ul>
    </div>

    <div class="home_action_buttons">
      <button id="open_full_list" type="button">See full list</button>

      <button class="add_transaction_btn" id="add_transaction_btn" type="button">
        Add Transaction
      </button>
    </div>
  </div>

  <dialog id="transaction_modal">
    <h2>Add Transaction</h2>
    <form id="transaction_form">
      <input type="text" id="name" placeholder="Name" required />
      <input
        type="number"
        id="amount"
        placeholder="Amount"
        required
        min="0.01"
        step="0.01"
      />

      <select id="type">
        <option value="expense">Expense</option>
        <option value="income">Income</option>
      </select>

      <select id="category">
        <option value="food">Food</option>
        <option value="transportation">Transportation</option>
        <option value="shopping">Shopping</option>
        <option value="entertainment">Entertainment</option>
        <option value="bills">Bills</option>
        <option value="health">Health</option>
        <option value="education">Education</option>
        <option value="other">Other</option>
      </select>

      <div class="modal_buttons">
        <button type="submit">Add</button>
        <button type="button" id="close_modal">Cancel</button>
      </div>
    </form>

    <div id="keyboardContainerHome" class="home-keyboard-container hidden">
      <img src="Icon-Images/keyboard.png" alt="On-screen keyboard" class="home-keyboard-image" />
    </div>
  </dialog>

  <dialog id="full_list">
    <h2>All Transactions</h2>
    <div id="all_transactions"></div>
    <button id="close_full_list" type="button">Close</button>
  </dialog>

  <dialog id="delete_confirm_modal">
    <h2>Are you sure you want to delete this transaction?</h2>

    <div class="modal_buttons">
      <button id="confirm_delete_btn" type="button">Delete</button>
      <button id="cancel_delete_btn" type="button">Cancel</button>
    </div>
  </dialog>

  <div class="navigation_bar">
    <ul class="menu_bar">
      <li>
        <a href="index.html" class="active">
          <img src="Icon-Images/home.png" alt="Home" class="icon">
          <p>Home</p>
        </a>
      </li>
      <li>
        <a href="analytics.html">
          <img src="Icon-Images/analytics.png" alt="Analytics" class="icon">
          <p>Analytics</p>
        </a>
      </li>
      <li>
        <a href="budget.html">
          <img src="Icon-Images/budget.png" alt="Budget" class="icon">
          <p>Budgets</p>
        </a>
      </li>
      <li>
        <a href="profile.html">
          <img src="Icon-Images/profile.png" alt="Profile" class="icon">
          <p>Profiles</p>
        </a>
      </li>
    </ul>
  </div>

  <script src="js/transactions.js"></script>
</body>
</html>
