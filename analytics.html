<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TerpFinance</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="background">

<div id = "text_area">
    <h1> Choices Screen </h1>

    <h3> What year are you? </h3>
    <input type="radio" name="camera1" value="Freshman" checked> Freshman<br>
    <input type="radio" name="camera1" value="Sophomore"> Sophomore<br>
    <input type="radio" name="camera1" value="Junior"> Junior<br>
    <input type="radio" name="camera1" value="Senior"> Senior<br><br>

    <h3>What major are you?</h3>
    <select id="camera2">
        <option value="Engineering & Technology">Engineering & Technology</option>
        <option value="Business & Entrepreneurship">Business & Entrepreneurship</option>
        <option value="Natural & Physical Sciences">Natural & Physical Sciences</option>
    </select>

    <br><br>

    <button onclick="printChoice()">Submit Choices</button>

    <p id="result"></p>
</div>

<div class="navigation_bar"> 
        <ul class="menu_bar">
            <li><a href="analytics.html" class="active"><img src="Icon-Images/analytics.png" alt="Analytics" class="icon"></a></li>
            <li><a href="calendar.html"><img src="Icon-Images/calendar.png" alt="Calendar" class="icon"></a></li>
            <li><a href="index.html"><img src="Icon-Images/home.png" alt="Home" class="icon"></a></li>
            <li><a href="budget.html"><img src="Icon-Images/budget.png" alt="Budget" class="icon"></a></li>
            <li><a href="profile.html"><img src="Icon-Images/profile.png" alt="Profile" class="icon"></a></li>
        </ul>
    </div>

<script>
function printChoice() {
    let year = document.querySelector('input[name="camera1"]:checked').value;
    let dropdown = document.getElementById("camera2").value;

    document.getElementById("result").innerHTML =
        "You are a " + year + " and in " + dropdown + ". Thank you for submitting your year and major!";
}
</script>


</body>
