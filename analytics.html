<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TerpFinance</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="background">
    <main class="screen">
        <section class="page-header">
            <h1>Analytics</h1>
            <p>View trends and graphs</p>
        </section>

        <div class="overall_trend_dark_bg">
            <h1>Overall Trend</h1>
            <div class="overall_trend_light_bg">
                <h2>Net Gain/Loss: <span style="color: #3d7d4c">+$90</span></h2>
                <h2>Estimated Time to Savings Goal: <span style="color: #3d7d4c">134 days</span></h2>
            </div>
        </div>

        <h1 style="margin-top: 30px; margin-left: 25px;">Visualization</h1>
            <div class="switch" id="iconSwitch">
                <div class="track"></div>
                <div class="thumb">
                    <img class="icon-off" src="Icon-Images/line-graph-icon.png" alt="Off Icon">
                    <img class="icon-on" src="Icon-Images/pie-chart-icon.png" alt="On Icon">
                </div>
            </div>
        <img id="graph_image" src="Icon-Images/line-graph.png"></img>
    </main>

    <div class="navigation_bar"> 
        <ul class="menu_bar">
            <li><a href="index.html"><img src="Icon-Images/home.png" alt="Home" class="icon"><p>Home</p></a></li>
            <li><a href="analytics.html" class="active"><img src="Icon-Images/analytics.png" alt="Analytics" class="icon"><p>Analytics</p></a></li>
            <li><a href="budget.html"><img src="Icon-Images/budget.png" alt="Budget" class="icon"><p>Budgets</p></a></li>
            <li><a href="profile.html"><img src="Icon-Images/profile.png" alt="Profile" class="icon"><p>Profiles</p></a></li>
        </ul>
